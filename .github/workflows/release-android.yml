name: Release Android Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.3)'
        required: false
        default: 'v1.0.3'

permissions:
  contents: write

jobs:
  build-and-release-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies and build
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          npx --prefix frontend cap sync android

      - name: Build Android Release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publish Stable Android APK Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}"
          APK_PATH="frontend/android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" "DLBC-Information-Unit-Android.apk"
            gh release upload "$TAG" "DLBC-Information-Unit-Android.apk" --clobber
          else
            echo "Release APK not found at $APK_PATH"
            exit 1
          fi
