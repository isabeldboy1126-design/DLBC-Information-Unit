name: Release Windows Desktop Application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: "https://szgdxynzjzgtingwbwcu.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Supabase Authentication Configuration
        shell: pwsh
        env:
          VITE_SUPABASE_URL: "https://szgdxynzjzgtingwbwcu.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          Write-Host "Validating Supabase authentication configuration for Windows release..."
          if (-not $env:VITE_SUPABASE_PUBLISHABLE_KEY -or $env:VITE_SUPABASE_PUBLISHABLE_KEY.Trim() -eq "") {
            Write-Error "CRITICAL: VITE_SUPABASE_PUBLISHABLE_KEY Actions secret is missing or empty! Release packaging cannot proceed without Supabase authentication keys."
            exit 1
          }
          if (-not $env:VITE_SUPABASE_URL -or $env:VITE_SUPABASE_URL.Trim() -eq "") {
            Write-Error "CRITICAL: VITE_SUPABASE_URL is missing or empty! Release packaging cannot proceed."
            exit 1
          }
          Write-Host "Supabase configuration verified successfully (URL and publishable key present)."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests and build
        env:
          VITE_SUPABASE_URL: "https://szgdxynzjzgtingwbwcu.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build --prefix frontend

      - name: Build Tauri Desktop & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_SUPABASE_URL: "https://szgdxynzjzgtingwbwcu.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          releaseName: "DLBC Information Unit ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}"
          releaseBody: |
            DLBC Information Unit Windows Desktop Application.
            
            ### Installation
            Download and run `DLBC Information Unit_1.0.0_x64-setup.exe` to install the desktop client.
            
            - Built with Tauri V2
            - Single-instance recording protection
            - Cryptographically signed automatic background updates
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Publish Stable Windows Installer Asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.release_tag }}' }
          Write-Host "Locating built setup.exe in frontend/src-tauri/target..."
          $installer = Get-ChildItem -Path "frontend/src-tauri/target" -Recurse -Filter "*setup.exe" | Where-Object { $_.Name -notmatch "DLBC-Information-Unit-Setup-x64.exe" } | Select-Object -First 1
          if ($installer) {
            Write-Host "Found installer: $($installer.FullName)"
            $stableInstaller = Join-Path $installer.DirectoryName "DLBC-Information-Unit-Setup-x64.exe"
            Copy-Item $installer.FullName $stableInstaller -Force
            Write-Host "Uploading stable public installer ($stableInstaller) to release $tag..."
            gh release upload $tag $stableInstaller --clobber
            Write-Host "Stable installer uploaded successfully."
          } else {
            Write-Warning "No installer found to create stable asset."
          }
