name: Build and Push Backend Container

on:
  push:
    branches: [ master, main ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-azure.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: dlbcregistry839201.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image to ACR
        run: |
          docker build -t dlbcregistry839201.azurecr.io/dlbc-backend:v1 -t dlbcregistry839201.azurecr.io/dlbc-backend:latest ./backend
          docker push dlbcregistry839201.azurecr.io/dlbc-backend:v1
          docker push dlbcregistry839201.azurecr.io/dlbc-backend:latest
