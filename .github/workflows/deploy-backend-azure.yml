name: Build and Push Backend Container

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-azure.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        run: |
          IMAGE_GHCR=ghcr.io/${{ github.repository_owner }}/dlbc-backend
          docker build -t ${IMAGE_GHCR}:latest -t ${IMAGE_GHCR}:v1 ./backend
          docker push ${IMAGE_GHCR}:latest
          docker push ${IMAGE_GHCR}:v1

      - name: Log in and push to Azure Container Registry (if configured)
        if: "${{ secrets.ACR_PASSWORD != '' }}"
        uses: azure/docker-login@v2
        with:
          login-server: dlbcregistry839201.azurecr.io
          username: dlbcregistry839201
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push to ACR (if configured)
        if: "${{ secrets.ACR_PASSWORD != '' }}"
        run: |
          IMAGE_ACR=dlbcregistry839201.azurecr.io/dlbc-backend
          docker tag ghcr.io/${{ github.repository_owner }}/dlbc-backend:v1 ${IMAGE_ACR}:v1
          docker tag ghcr.io/${{ github.repository_owner }}/dlbc-backend:latest ${IMAGE_ACR}:latest
          docker push ${IMAGE_ACR}:v1
          docker push ${IMAGE_ACR}:latest
